<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedLex{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MED<span class="text-info">LEX</span></a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">Início</a></li>
                <li class="nav-item"><a class="nav-link {% if request.endpoint in ['listar_conceitos','detalhe','editar_get','editar_post','novo_get','novo_post'] %}active{% endif %}" href="/conceitos">Vocabulário</a></li>
                <li class="nav-item"><a class="nav-link {% if request.endpoint == 'information_retrieval' %}active{% endif %}" href="/ir">Artigos (IR)</a></li>
                <li class="nav-item"><a class="nav-link {% if request.endpoint in ['qa_get', 'qa_post'] %}active{% endif %}" href="/qa">Perguntas (QA)</a></li>
            </ul>
            <a href="/conceitos/novo" class="btn btn-outline-light btn-sm">+ Novo Termo</a>
        </div>
    </div>
</nav>

<main class="container flex-grow-1 mb-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    <div class="container small">MedLex &middot; Processamento de Linguagem Natural</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
